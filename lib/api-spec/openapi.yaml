openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PeerBridge - Student Mentorship Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: notifications
    description: Private member notifications
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User profile operations
  - name: districts
    description: School district channel operations
  - name: requests
    description: Mentorship request operations
  - name: tags
    description: Tag category operations
  - name: reports
    description: Report and block operations
  - name: stats
    description: Statistics and dashboard operations
  - name: chat
    description: Python chat learning routes preserve both implemented room/conversation results and unfinished
      ScaffoldTodo responses. WebSocket contracts are documented separately in docs/runbooks/api-gateway.md.
paths:
  /notifications:
    get:
      operationId: listNotifications
      tags:
        - notifications
      summary: List the latest 50 notifications and total unread count for the signed-in member
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
      x-required-authority: student
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags:
        - notifications
      summary: Mark all notifications belonging to the signed-in member as read
      responses:
        "204":
          description: Success
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
      x-required-authority: student
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
      x-required-authority: public
  /auth/register:
    post:
      operationId: register
      tags:
        - auth
      summary: Register with school email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
      x-required-authority: public
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Login with school email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
      x-required-authority: public
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
      x-required-authority: session
  /auth/me:
    get:
      operationId: getMe
      tags:
        - auth
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
      x-required-authority: session
  /users/{id}:
    get:
      operationId: getUser
      tags:
        - users
      summary: Get own account or a member profile summary
      description: Own profile is available to the authenticated account before verification and returns full User.
        Other profiles require server-computed member access and expose only id, name, subjects, and
        createdAt.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Minimum profile summary
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/ProfileSummary"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: session
    patch:
      operationId: updateUser
      tags:
        - users
      summary: Update the authenticated user's allowed profile fields
      description: |-
        The gateway accepts only name, bio, and subjects for the authenticated session owner. Administrators may update name only. Identity and authorization fields, including id, email, role, and is_verified, are rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated minimum self profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
      x-required-authority: session
  /districts:
    get:
      operationId: listDistricts
      tags:
        - districts
      summary: List all school districts
      parameters:
        - name: type
          in: query
          description: Filter by district type; omit to return all supported districts.
          schema:
            type: string
            enum:
              - high_school
              - unified
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
      x-required-authority: public
  /districts/{id}:
    get:
      operationId: getDistrict
      tags:
        - districts
      summary: Get a district channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: District details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: member
  /requests:
    get:
      operationId: listRequests
      tags:
        - requests
      summary: List mentorship requests
      parameters:
        - name: districtId
          in: query
          schema:
            type: integer
        - name: tagId
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
            enum:
              - mentor
              - mentee
        - name: status
          in: query
          schema:
            type: string
            enum:
              - open
              - matched
              - closed
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: before
          in: query
          description: Older than this timezone-aware createdAt and positive id tuple.
          schema:
            type: string
            maxLength: 96
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-][0-9]{2}:[0-9]{2})\|[1-9][0-9]*$'
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: member
    post:
      operationId: createRequest
      tags:
        - requests
      summary: Post a mentorship request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestBody"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "404":
          $ref: "#/components/responses/Error404"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: student
  /requests/{id}:
    get:
      operationId: getRequest
      tags:
        - requests
      summary: Get a mentorship request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "422":
          $ref: "#/components/responses/Error422"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: member
    patch:
      operationId: updateRequest
      tags:
        - requests
      summary: Update a mentorship request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequestBody"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "409":
          $ref: "#/components/responses/Error409"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
      x-required-authority: student
    delete:
      operationId: deleteRequest
      tags:
        - requests
      summary: Delete a mentorship request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Deleted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "422":
          $ref: "#/components/responses/Error422"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
      x-required-authority: member
  /requests/{id}/match:
    post:
      operationId: matchRequest
      tags:
        - requests
      summary: Apply to a mentorship request (compatibility alias)
      description: Creates a pending application. Only the author can accept it; this endpoint never matches immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Application saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestApplication"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "422":
          $ref: "#/components/responses/Error422"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - cookieAuth: []
      x-required-authority: student
  /tags:
    get:
      operationId: listTags
      tags:
        - tags
      summary: List all tags
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: member
  /reports:
    post:
      operationId: createReport
      tags:
        - reports
      summary: Report a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: student
  /blocks:
    get:
      operationId: listBlocks
      tags:
        - reports
      summary: List blocked users
      responses:
        "200":
          description: Blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: student
    post:
      operationId: blockUser
      tags:
        - reports
      summary: Block a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserBody"
      responses:
        "201":
          description: User blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: student
  /blocks/{blockedUserId}:
    delete:
      operationId: unblockUser
      tags:
        - reports
      summary: Unblock a user
      parameters:
        - name: blockedUserId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Unblocked
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "422":
          $ref: "#/components/responses/Error422"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
        "403":
          $ref: "#/components/responses/Error403"
      security:
        - cookieAuth: []
      x-required-authority: student
  /stats/overview:
    get:
      operationId: getStatsOverview
      tags:
        - stats
      summary: Platform statistics overview
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "429":
          $ref: "#/components/responses/Error429"
