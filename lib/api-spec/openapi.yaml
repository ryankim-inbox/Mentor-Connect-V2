components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error: &a1
          type: string
          minLength: 1
      required:
        - error
      additionalProperties: false
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    RegisterBody:
      type: object
      properties:
        email:
          type: string
          description: Must be a .edu email address
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
            - mentor
            - mentee
            - both
        districtId:
          type: integer
      required:
        - email
        - name
        - password
        - role
        - districtId
    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user
        - message
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - mentor
            - mentee
            - both
        districtId:
          type: integer
        districtName:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
        subjects:
          type: array
          items:
            type: string
        isVerified:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - email
        - name
        - role
        - districtId
        - isVerified
        - createdAt
        - subjects
    UpdateUserBody:
      type: object
      description:
        Allowlisted self-profile fields. Other fields are rejected by the
        gateway.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        bio:
          type:
            - string
            - "null"
          maxLength: 2000
        subjects:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
    District:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        county:
          type: string
        type:
          type: string
