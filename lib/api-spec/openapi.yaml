openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PeerBridge - Student Mentorship Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User profile operations
  - name: districts
    description: School district channel operations
  - name: requests
    description: Mentorship request operations
  - name: tags
    description: Tag category operations
  - name: reports
    description: Report and block operations
  - name: stats
    description: Statistics and dashboard operations
  - name: chat
    description: Python chat learning routes preserve both implemented
      room/conversation results and unfinished ScaffoldTodo responses. WebSocket
      contracts are documented separately in docs/runbooks/api-gateway.md.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
  /auth/register:
    post:
      operationId: register
      tags:
        - auth
      summary: Register with school email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Login with school email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /auth/me:
    get:
      operationId: getMe
      tags:
        - auth
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /users/{id}:
    get:
      operationId: getUser
      tags:
        - users
      summary: Get a minimum profile summary
      description:
        A signed-in user may request any canonical user id. The gateway
        exposes only id, name, subjects, and createdAt; the self-only rule
        applies to PATCH.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Minimum profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
    patch:
      operationId: updateUser
      tags:
        - users
      summary: Update the authenticated user's allowed profile fields
      description: |
        The gateway accepts only name, bio, and subjects for the authenticated
        session owner. Identity and authorization fields, including id, email,
        role, and is_verified, are rejected before any upstream request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated minimum self profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /districts:
    get:
      operationId: listDistricts
      tags:
        - districts
      summary: List all school districts
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - high_school
              - all
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
  /districts/{id}:
    get:
      operationId: getDistrict
      tags:
        - districts
      summary: Get a district channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: District details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /requests:
    get:
      operationId: listRequests
      tags:
        - requests
      summary: List mentorship requests
      parameters:
        - name: districtId
          in: query
          schema:
            type: integer
        - name: tagId
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
            enum:
              - mentor
              - mentee
        - name: status
          in: query
          schema:
            type: string
            enum:
              - open
              - matched
              - closed
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
    post:
      operationId: createRequest
      tags:
        - requests
      summary: Post a mentorship request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestBody"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /requests/{id}:
    get:
      operationId: getRequest
      tags:
        - requests
      summary: Get a mentorship request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
    patch:
      operationId: updateRequest
      tags:
        - requests
      summary: Update a mentorship request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequestBody"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
    delete:
      operationId: deleteRequest
      tags:
        - requests
      summary: Delete a mentorship request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /requests/{id}/match:
    post:
      operationId: matchRequest
      tags:
        - requests
      summary: Match/respond to a mentorship request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipRequest"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /tags:
    get:
      operationId: listTags
      tags:
        - tags
      summary: List all tags
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /reports:
    post:
      operationId: createReport
      tags:
        - reports
      summary: Report a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /blocks:
    get:
      operationId: listBlocks
      tags:
        - reports
      summary: List blocked users
      responses:
        "200":
          description: Blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
    post:
      operationId: blockUser
      tags:
        - reports
      summary: Block a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserBody"
      responses:
        "201":
          description: User blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /blocks/{blockedUserId}:
    delete:
      operationId: unblockUser
      tags:
        - reports
      summary: Unblock a user
      parameters:
        - name: blockedUserId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unblocked
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /stats/overview:
    get:
      operationId: getStatsOverview
      tags:
        - stats
      summary: Platform statistics overview
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security: []
  /stats/district/{id}:
    get:
      operationId: getDistrictStats
      tags:
        - stats
      summary: Stats for a specific district
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: District stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictStats"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /chat/rooms:
    get:
      operationId: listChatRooms
      tags:
        - chat
      summary: (scaffold) List the current user's chat rooms
      description: |
        Student TODO — intended contract: the global room plus the current
        user's district room. Returns ScaffoldTodo until implemented.
      responses:
        "200":
          description: Rooms, or the scaffold TODO envelope
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/ChatRoom"
                  - $ref: "#/components/schemas/ScaffoldTodo"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
  /chat/rooms/{roomId}/messages:
    get:
      operationId: listChatRoomMessages
      tags:
        - chat
      summary: (scaffold) Message history for a chat room
      description: |
        Student TODO — intended contract: recent messages (oldest first,
        soft-deleted rows excluded) with sender names. Returns ScaffoldTodo
        until implemented.
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages, or the scaffold TODO envelope
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                  - $ref: "#/components/schemas/ScaffoldTodo"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "502":
          $ref: "#/components/responses/Error502"
        "503":
          $ref: "#/components/responses/Error503"
        "504":
          $ref: "#/components/responses/Error504"
      security:
        - cookieAuth: []
    post:
      operationId: sendChatRoomMessage
      tags:
        - chat
      summary: (scaffold) Post a message into a chat room
      description: |
        Student TODO — intended contract: validate membership + body text,
        insert into chat_messages, return the created message with 201.
        Returns 200 with ScaffoldTodo until implemented.
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageBody"
      responses:
        "200":
          description: Scaffold TODO envelope (endpoint not implemented yet)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ChatMessage"
                  - $ref: "#/components/schemas/ScaffoldTodo"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "201":
          description: Message created (once the student implements it)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ChatMessage"
                  - $ref: "#/components/schemas/ScaffoldTodo"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
