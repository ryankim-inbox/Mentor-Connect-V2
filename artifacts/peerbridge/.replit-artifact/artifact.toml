kind = "web"
previewPath = "/"
title = "PeerBridge - Student Mentorship"
version = "1.0.0"
id = "artifacts/peerbridge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21288

[services.development]
run = "pnpm --filter @workspace/peerbridge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/peerbridge", "run", "build" ]
publicDir = "artifacts/peerbridge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/login"
to = "/index.html"

[[services.production.rewrites]]
from = "/register"
to = "/index.html"

[[services.production.rewrites]]
from = "/dashboard"
to = "/index.html"

[[services.production.rewrites]]
from = "/dashboard/practice-lab"
to = "/index.html"

[[services.production.rewrites]]
from = "/districts"
to = "/index.html"

[[services.production.rewrites]]
from = "/districts/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/requests"
to = "/index.html"

[[services.production.rewrites]]
from = "/requests/new"
to = "/index.html"

[[services.production.rewrites]]
from = "/requests/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/profile"
to = "/index.html"

[[services.production.rewrites]]
from = "/profile/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/settings"
to = "/index.html"

[[services.production.rewrites]]
from = "/recommendations"
to = "/index.html"

[[services.production.rewrites]]
from = "/practice-lab"
to = "/index.html"

[[services.production.rewrites]]
from = "/analytics"
to = "/index.html"

[[services.production.rewrites]]
from = "/scheduling"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin/reports"
to = "/index.html"

[services.env]
PORT = "21288"
BASE_PATH = "/"
