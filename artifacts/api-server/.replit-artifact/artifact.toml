kind = "api"
title = "Private Python Backend"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8181
name = "Private Python Backend"
# No public path may target this process. The TypeScript API Shield owns /api
# and /ws, then reaches this loopback-only service over 127.0.0.1:8181.
paths = []

# The backend source of truth moved to the repo-root Python/ folder.
# artifacts/api-server/python/ is kept only as legacy reference.
[services.development]
run = "cd ../.. && PYTHONDONTWRITEBYTECODE=1 python -B -m uvicorn main:app --app-dir Python --host 127.0.0.1 --port 8181"

[services.production]

[services.production.build]
args = [
  "sh", "-c",
  "test \"$(node --version)\" = \"v$(cat .node-version)\" && RELEASE_RUNTIME_DIR=\"$PWD/.release-runtime\" sh ops/build-python-runtime.sh",
]

[services.production.build.env]
NODE_ENV = "production"

# Start uvicorn from the frozen runtime rather than via `python Python/main.py`.
#
# That entrypoint's __main__ block calls uvicorn.run(..., reload=True), so
# production booted the autoreloader: verified locally, it logs
# "Will watch for changes in these directories: ['<repo root>']" and starts a
# StatReload supervisor that polls the whole tree, node_modules included, on
# every autoscale instance. Uvicorn documents reload as development-only.
#
# `--app-dir Python` puts Python/ on sys.path so `main:app` resolves the same
# way the old command did, while skipping __main__ entirely. Keep --port in
# sync with localPort above and with PORT below.
[services.production.run]
args = [
  ".release-runtime/venv/bin/python", "-B", "-m", "uvicorn", "main:app",
  "--host", "127.0.0.1",
  "--port", "8181",
  "--app-dir", "Python",
]

[services.production.run.env]
PORT = "8181"
NODE_ENV = "production"
PYTHONDONTWRITEBYTECODE = "1"

[services.production.health.startup]
path = "/api/healthz"
