name: Production release surface

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_FREEZE_BASE: 98e1b04c292302bd25365ed7db4c5675671df337
  PYTHON_PR_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  peerbridge-release-surface:
    name: peerbridge-release-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pnpm from packageManager
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Provide PostgreSQL 16 tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          sudo systemctl stop postgresql || true
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify full classroom release
        run: pnpm verify:release

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pnpm from packageManager
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        id: audit_production
        continue-on-error: true
        run: pnpm audit --prod --audit-level high --json > audit-production.json
      - name: Audit complete release toolchain
        id: audit_complete
        continue-on-error: true
        run: pnpm audit --audit-level high --json > audit-complete.json
      - name: Retain dependency audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-reports
          path: audit-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce high and critical dependency gate
        if: steps.audit_production.outcome == 'failure' || steps.audit_complete.outcome == 'failure'
        run: exit 1
